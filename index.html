<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game filter</title>
    <link id="page-favicon" rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Load site configuration before applying the tab title and favicon. -->
    <script src="config.js"></script>
    <script>
        document.title = SITE_CONFIG.page.title;
        document.getElementById('page-favicon').href = SITE_CONFIG.page.favicon;
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css">
    <script src="information.js"></script>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-main" class="sidebar-main">
            <h2 id="store-filter-title"></h2>
            <div id="category-filters" class="filter-grid filter-grid-categories"></div>
            <div class="filter-group food-filter-group">
                <h3 id="additional-filter-title"></h3>
                <div id="additional-filters" class="filter-grid filter-grid-additional"></div>
            </div>
            <hr class="sidebar-divider category-divider">
            <div class="game-store-filters">
                <div id="game-store-filter" class="filter-grid filter-grid-game-store"></div>
                <div id="feature-filters" class="filter-grid filter-grid-features"></div>
            </div>
            <div id="store-list"></div>
            <button type="button" id="info-open" class="info-open-button" aria-controls="info-view" aria-expanded="false">Info</button>
        </div>
        <section id="info-view" class="info-view" aria-labelledby="info-title" hidden>
            <header class="info-view-header">
                <h2 id="info-title"></h2>
                <button type="button" id="info-close" class="info-close-button">Back</button>
            </header>
            <div id="info-sections" class="info-sections"></div>
        </section>
    </div>

    <button type="button" id="sidebar-toggle" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true" title="Hide sidebar">
        <span class="toggle-chevron" aria-hidden="true"></span>
    </button>

    <div id="map"></div>

    <!-- Load dependencies before app.js; app.js is the application entry point. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
   
	<!-- 2. Papa Parse Engine for CSV Translation -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>
    <script src="app.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d502082268284ccd862262c8ce64f75a"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
