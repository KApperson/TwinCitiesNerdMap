<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game filter</title>
    <link id="page-favicon" rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="config.js"></script>
    <script>
        document.title = SITE_CONFIG.page.title;
        document.getElementById('page-favicon').href = SITE_CONFIG.page.favicon;
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="sidebar">
        <h2 id="store-filter-title"></h2>
        <div id="category-filters" class="filter-group"></div>
        <hr class="sidebar-divider">
        <div class="filter-group game-store-filters">
            <div id="game-store-filter"></div>
            <div id="feature-filters" class="feature-filter-group"></div>
        </div>
        <div id="store-list"></div>
        <details class="credits">
            <summary>Credits</summary>
            <div class="credits-content">
                <p>Copyright 2026 KApperson</p>
                <p>Contact kapperson.pfs#nerdmap@gmail.com for updates</p>
            </div>
        </details>
    </div>

    <button type="button" id="sidebar-toggle" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true" title="Hide sidebar">
        <span class="toggle-chevron" aria-hidden="true"></span>
    </button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
   
	<!-- 2. Papa Parse Engine for CSV Translation -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>


    <script>
        // Global storage for the stores once loaded
        let storesData = [];
        let storeTagFields = [];
        let storeFeatureFields = [];

        function formatTagLabel(field) {
            return SITE_CONFIG.tags.labels[field.toLowerCase()] || field
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .replace(/[_-]+/g, ' ')
                .replace(/\b\w/g, character => character.toUpperCase());
        }

        function hasStoreTag(store, field) {
            return String(store[field] || '').trim().toUpperCase() === 'TRUE';
        }

        function getStorePinColor(store) {
            const pinColors = SITE_CONFIG.pins;
            const isConfiguredColor = color => typeof color === 'string' && color.trim() !== '';
            const configuredCategory = SITE_CONFIG.filters.categories
                .find(category => hasStoreTag(store, category.field) && isConfiguredColor(pinColors.categories[category.field]));

            if (configuredCategory) return pinColors.categories[configuredCategory.field];

            const configuredSubcategory = storeFeatureFields
                .find(field => hasStoreTag(store, field) && isConfiguredColor(pinColors.subcategories[field]));

            if (configuredSubcategory) return pinColors.subcategories[configuredSubcategory];
            if (isConfiguredColor(pinColors.categories.gameStores)) return pinColors.categories.gameStores;
            return pinColors.defaultColor;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function renderFeatureFilters() {
            const container = document.getElementById('feature-filters');
            container.innerHTML = '';

            storeFeatureFields.forEach(field => {
                const label = document.createElement('label');
                label.className = 'filter-label';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.dataset.storeField = field;
                checkbox.disabled = !document.getElementById('filter-game-stores').checked;
                label.append(checkbox, document.createTextNode(` ${formatTagLabel(field)}`));
                container.appendChild(label);
            });
        }

        function renderFilterControls() {
            const categoryContainer = document.getElementById('category-filters');
            SITE_CONFIG.filters.categories.forEach(category => {
                const label = document.createElement('label');
                label.className = 'filter-label';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `filter-category-${category.field}`;
                checkbox.dataset.categoryField = category.field;
                label.append(checkbox, document.createTextNode(` ${category.label}`));
                categoryContainer.appendChild(label);
            });

            const gameStoreLabel = document.createElement('label');
            gameStoreLabel.className = 'filter-label';
            const gameStoreCheckbox = document.createElement('input');
            gameStoreCheckbox.type = 'checkbox';
            gameStoreCheckbox.id = 'filter-game-stores';
            gameStoreLabel.append(gameStoreCheckbox, document.createTextNode(` ${SITE_CONFIG.filters.gameStores.label}`));
            document.getElementById('game-store-filter').appendChild(gameStoreLabel);
        }

        function syncFeatureFilters() {
            const enabled = document.getElementById('filter-game-stores').checked;
            document.querySelector('.game-store-filters').classList.toggle('expanded', enabled);
            document.querySelectorAll('#feature-filters input').forEach(checkbox => {
                checkbox.disabled = !enabled;
                if (!enabled) checkbox.checked = false;
            });
        }

        document.getElementById('store-filter-title').textContent = SITE_CONFIG.page.title;
        renderFilterControls();

        const map = L.map('map').setView(
            [SITE_CONFIG.map.center.latitude, SITE_CONFIG.map.center.longitude],
            SITE_CONFIG.map.zoom
        );

        // Load Free OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);

        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        sidebarToggle.addEventListener('click', () => {
            const isExpanded = sidebarToggle.getAttribute('aria-expanded') === 'true';
            document.body.classList.toggle('sidebar-collapsed', isExpanded);
            sidebarToggle.setAttribute('aria-expanded', String(!isExpanded));
            sidebarToggle.setAttribute('aria-label', isExpanded ? 'Show sidebar' : 'Hide sidebar');
            sidebarToggle.title = isExpanded ? 'Show sidebar' : 'Hide sidebar';
        });
        sidebar.addEventListener('transitionend', event => {
            if (event.propertyName === 'flex-basis') {
                map.invalidateSize({ pan: false });
            }
        });

        // 3. Filter Engine
        function updateMap() {
            markerLayer.clearLayers();
            const listContainer = document.getElementById('store-list');
            listContainer.innerHTML = '';

            const selectedCategories = SITE_CONFIG.filters.categories.filter(category =>
                document.getElementById(`filter-category-${category.field}`).checked
            );
            const gameStoresSelected = document.getElementById('filter-game-stores').checked;
            const selectedFeatures = [...document.querySelectorAll('#feature-filters input:checked')]
                .map(checkbox => checkbox.dataset.storeField);
            const hasCategoryFilter = selectedCategories.length > 0 || gameStoresSelected;

            storesData.forEach(store => {
                const isCategoryStore = SITE_CONFIG.filters.categories.some(category => hasStoreTag(store, category.field));
                const isGameStore = !isCategoryStore;
                const matchesFeatures = selectedFeatures.every(field => hasStoreTag(store, field));
                const matchesCategories = !hasCategoryFilter ||
                    selectedCategories.some(category => hasStoreTag(store, category.field)) ||
                    (gameStoresSelected && isGameStore && matchesFeatures);

                if (matchesCategories && store.lat && store.lng) {
                    const pinColor = escapeHtml(getStorePinColor(store));
                    const pinIcon = L.divIcon({
                        className: 'store-pin-icon',
                        html: `<svg viewBox="0 0 25 41" aria-hidden="true"><path d="M12.5 1C6.2 1 1 6.2 1 12.5c0 8.2 11.5 27 11.5 27s11.5-18.8 11.5-27C24 6.2 18.8 1 12.5 1Z" fill="${pinColor}" stroke="#fff" stroke-width="1.5"/><circle cx="12.5" cy="12.5" r="3.5" fill="#fff"/></svg>`,
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34]
                    });
                    const marker = L.marker([parseFloat(store.lat), parseFloat(store.lng)], { icon: pinIcon });
                    const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${store.lat},${store.lng}`)}`;
                    const summaryHtml = store.summary?.trim()
                        ? `<div class="store-summary">${escapeHtml(store.summary)}</div>`
                        : '';
                    const tagsHtml = storeTagFields
                        .filter(field => hasStoreTag(store, field))
                        .map(field => `<span class="store-tag store-tag-${field.toLowerCase()}">${formatTagLabel(field)}</span>`)
                        .join('');
                    const popupContent = `
                        <strong>${escapeHtml(store.name)}</strong><br>
                        ${summaryHtml}
                        ${escapeHtml(store.address)}<br>
                        <div class="store-tags">${tagsHtml}</div>
                        <a href="${store.website}" target="_blank" rel="noopener noreferrer">Visit Website</a><br>
                        <a class="directions-button" href="${directionsUrl}" target="_blank" rel="noopener noreferrer">Get Directions</a>
                    `;
                    marker.bindPopup(popupContent, { minWidth: 320, maxWidth: 420 });
                    markerLayer.addLayer(marker);

                    const item = document.createElement('div');
                    item.className = 'store-list-item';
                    item.innerHTML = `<strong>${escapeHtml(store.name)}</strong>${summaryHtml}<br><a href="${store.website}" target="_blank" rel="noopener noreferrer">Website</a>`;
                    listContainer.appendChild(item);
                }
            });
        }

        // 4. Download and Stream CSV Data Natively
        Papa.parse('stores.csv', {
            download: true,
            header: true,
            complete: function(results) {
                storesData = results.data;
                const websiteIndex = results.meta.fields.indexOf('website');
                storeTagFields = results.meta.fields.slice(websiteIndex + 1)
                    .filter(field => !SITE_CONFIG.tags.excludedFields.includes(field.toLowerCase()));
                const configuredFeatureFields = SITE_CONFIG.filters.gameStores.subFilters.fields;
                const categoryFields = SITE_CONFIG.filters.categories.map(category => category.field.toLowerCase());
                storeFeatureFields = (configuredFeatureFields === null
                    ? storeTagFields.filter(field => !categoryFields.includes(field.toLowerCase()))
                    : configuredFeatureFields.filter(field => storeTagFields.some(tag => tag.toLowerCase() === field.toLowerCase())));
                renderFeatureFilters();
                updateMap(); // Initial pass to render pins once data lands
            }
        });

        const gameStoresToggle = document.getElementById('filter-game-stores');
        gameStoresToggle.addEventListener('change', () => {
            syncFeatureFilters();
            updateMap();
        });
        document.getElementById('feature-filters').addEventListener('change', event => {
            if (event.target.checked) gameStoresToggle.checked = true;
            syncFeatureFilters();
            updateMap();
        });
        document.getElementById('category-filters').addEventListener('change', updateMap);
    </script>
</body>
</html>
