<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store Finder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="sidebar">
        <h2>Store Filter</h2>
        <div class="filter-group">
            <label class="filter-label"><input type="checkbox" id="tcg"> Trading Card Games (TCG)</label>
            <label class="filter-label"><input type="checkbox" id="ttrpg"> Tabletop RPGs (TTRPG)</label>
            <label class="filter-label"><input type="checkbox" id="boardgames"> Board Games</label>
            <label class="filter-label"><input type="checkbox" id="retro">Video Games</label>
			<label class="filter-label"><input type="checkbox" id="miniatures">Miniatures</label>
			<label class="filter-label"><input type="checkbox" id="comics">Comics</label>
			<label class="filter-label"><input type="checkbox" id="books">Books</label>
        </div>
        <hr class="sidebar-divider">
        <div id="store-list"></div>
        <details class="credits">
            <summary>Credits</summary>
            <div class="credits-content">
                <p>Copyright 2026 KApperson</p>
                <p>Contact kapperson.pfs#nerdmap@gmail.com for updates</p>
            </div>
        </details>
    </div>

    <button type="button" id="sidebar-toggle" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true" title="Hide sidebar">
        <span class="toggle-chevron" aria-hidden="true"></span>
    </button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
   
	<!-- 2. Papa Parse Engine for CSV Translation -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>


    <script>
        // Global storage for the stores once loaded
        let storesData = [];
        let storeTagFields = [];

        const tagLabels = {
            tcg: 'TCG',
            ttrpg: 'TTRPG',
            boardgames: 'Board Games',
            videogames: 'Video Games',
            escaperoom: 'Escape Room',
            '3rdspace': '3rd Space',
            foodinhouse: 'Food In-House',
            outsidefood: 'Outside Food'
        };

        function formatTagLabel(field) {
            return tagLabels[field.toLowerCase()] || field
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .replace(/[_-]+/g, ' ')
                .replace(/\b\w/g, character => character.toUpperCase());
        }

        // Initialize Map near Twin Cities
        const map = L.map('map').setView([45.0, -93.15], 9);

        // Load Free OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);

        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        sidebarToggle.addEventListener('click', () => {
            const isExpanded = sidebarToggle.getAttribute('aria-expanded') === 'true';
            document.body.classList.toggle('sidebar-collapsed', isExpanded);
            sidebarToggle.setAttribute('aria-expanded', String(!isExpanded));
            sidebarToggle.setAttribute('aria-label', isExpanded ? 'Show sidebar' : 'Hide sidebar');
            sidebarToggle.title = isExpanded ? 'Show sidebar' : 'Hide sidebar';
        });
        sidebar.addEventListener('transitionend', event => {
            if (event.propertyName === 'flex-basis') {
                map.invalidateSize({ pan: false });
            }
        });

        // 3. Filter Engine
        function updateMap() {
            markerLayer.clearLayers();
            const listContainer = document.getElementById('store-list');
            listContainer.innerHTML = '';

            const activeFilters = {
                tcg: document.getElementById('tcg').checked,
                ttrpg: document.getElementById('ttrpg').checked,
                boardgames: document.getElementById('boardgames').checked,
                retro: document.getElementById('retro').checked
            };

            storesData.forEach(store => {
                let matchesAll = true;
                
                for (let key in activeFilters) {
                    if (activeFilters[key]) {
                        // CSV true/false evaluations parse as strings ("TRUE" / "FALSE")
                        const isSpecialist = String(store[key]).trim().toUpperCase() === "TRUE";
                        if (!isSpecialist) {
                            matchesAll = false;
                        }
                    }
                }

                if (matchesAll && store.lat && store.lng) {
                    const marker = L.marker([parseFloat(store.lat), parseFloat(store.lng)]);
                    const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${store.lat},${store.lng}`)}`;
                    const tagsHtml = storeTagFields
                        .filter(field => String(store[field]).trim().toUpperCase() === 'TRUE')
                        .map(field => `<span class="store-tag store-tag-${field.toLowerCase()}">${formatTagLabel(field)}</span>`)
                        .join('');
                    const popupContent = `
                        <strong>${store.name}</strong><br>
                        ${store.address}<br>
                        <div class="store-tags">${tagsHtml}</div>
                        <a href="${store.website}" target="_blank" rel="noopener noreferrer">Visit Website</a><br>
                        <a class="directions-button" href="${directionsUrl}" target="_blank" rel="noopener noreferrer">Get Directions</a>
                    `;
                    marker.bindPopup(popupContent);
                    markerLayer.addLayer(marker);

                    const item = document.createElement('div');
                    item.className = 'store-list-item';
                    item.innerHTML = `<strong>${store.name}</strong><br><a href="${store.website}" target="_blank">Website</a>`;
                    listContainer.appendChild(item);
                }
            });
        }

        // 4. Download and Stream CSV Data Natively
        Papa.parse('stores.csv', {
            download: true,
            header: true,
            complete: function(results) {
                storesData = results.data;
                const websiteIndex = results.meta.fields.indexOf('website');
                storeTagFields = results.meta.fields.slice(websiteIndex + 1);
                updateMap(); // Initial pass to render pins once data lands
            }
        });

        // 5. Attach Filter Event Listeners
        document.querySelectorAll('.filter-group input').forEach(input => {
            input.addEventListener('change', updateMap);
        });
    </script>
</body>
</html>
