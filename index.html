<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store Finder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #1a1a1a; color: #fff; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.3); }
        #map { flex-grow: 1; height: 100%; }
        h2 { margin-top: 0; color: #ffdd57; font-size: 1.5rem; }
        .filter-group { display: flex; flex-direction: column; gap: 12px; }
        .filter-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 1rem; }
        .filter-label input { transform: scale(1.2); cursor: pointer; }
        .store-list-item { padding: 10px; border-bottom: 1px solid #333; font-size: 0.9rem; }
        .store-list-item a { color: #ffdd57; text-decoration: none; }
        #store-list { overflow-y: auto; flex-grow: 1; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Store Filter</h2>
        <div class="filter-group">
            <label class="filter-label"><input type="checkbox" id="tcg"> Trading Card Games (TCG)</label>
            <label class="filter-label"><input type="checkbox" id="ttrpg"> Tabletop RPGs (TTRPG)</label>
            <label class="filter-label"><input type="checkbox" id="boardgames"> Board Games</label>
            <label class="filter-label"><input type="checkbox" id="retro"> Retro Video Games</label>
        </div>
        <hr style="width:100%; border-color:#333;">
        <div id="store-list"></div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
   
	<!-- 2. Papa Parse Engine for CSV Translation -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>


    <script>
        // Global storage for the stores once loaded
        let storesData = [];

        // Initialize Map near Twin Cities
        const map = L.map('map').setView([45.0, -93.15], 9);

        // Load Free OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);

        // 3. Filter Engine
        function updateMap() {
            markerLayer.clearLayers();
            const listContainer = document.getElementById('store-list');
            listContainer.innerHTML = '';

            const activeFilters = {
                tcg: document.getElementById('tcg').checked,
                ttrpg: document.getElementById('ttrpg').checked,
                boardgames: document.getElementById('boardgames').checked,
                retro: document.getElementById('retro').checked
            };

            storesData.forEach(store => {
                let matchesAll = true;
                
                for (let key in activeFilters) {
                    if (activeFilters[key]) {
                        // CSV true/false evaluations parse as strings ("TRUE" / "FALSE")
                        const isSpecialist = String(store[key]).trim().toUpperCase() === "TRUE";
                        if (!isSpecialist) {
                            matchesAll = false;
                        }
                    }
                }

                if (matchesAll && store.lat && store.lng) {
                    const marker = L.marker([parseFloat(store.lat), parseFloat(store.lng)]);
                    const popupContent = `
                        <strong>${store.name}</strong><br>
                        ${store.address}<br>
                        <a href="${store.website}" target="_blank">Visit Website</a>
                    `;
                    marker.bindPopup(popupContent);
                    markerLayer.addLayer(marker);

                    const item = document.createElement('div');
                    item.className = 'store-list-item';
                    item.innerHTML = `<strong>${store.name}</strong><br><a href="${store.website}" target="_blank">Website</a>`;
                    listContainer.appendChild(item);
                }
            });
        }

        // 4. Download and Stream CSV Data Natively
        Papa.parse('stores.csv', {
            download: true,
            header: true,
            complete: function(results) {
                storesData = results.data;
                updateMap(); // Initial pass to render pins once data lands
            }
        });

        // 5. Attach Filter Event Listeners
        document.querySelectorAll('.filter-group input').forEach(input => {
            input.addEventListener('change', updateMap);
        });
    </script>
</body>
</html>
